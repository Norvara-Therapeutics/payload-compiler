name: Build GitHub prerelease

on:
  push:
    tags:
      - "v*rc*"

permissions:
  contents: write

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the project and test tools
        run: python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Check Python sources
        run: python -m ruff check src tests

  release:
    name: Build and publish prerelease
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tools
        run: python -m pip install build twine
      - name: Verify tag and package versions
        id: version
        shell: bash
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
          python - <<'PY'
          import ast
          import pathlib
          import tomllib

          configured = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          version_line = next(
              line
              for line in pathlib.Path("src/payload_compiler/__init__.py").read_text().splitlines()
              if line.startswith("__version__ = ")
          )
          runtime = ast.literal_eval(version_line.partition("=")[2].strip())
          assert configured == runtime, f"version mismatch: {configured} != {runtime}"
          PY
          echo "package=${package_version}" >> "${GITHUB_OUTPUT}"
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --prerelease
          --generate-notes
          --title "payload-compiler ${{ steps.version.outputs.package }}"
